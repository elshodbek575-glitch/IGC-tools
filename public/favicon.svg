<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Tab-size cut of the IGCtools badge: same hexagon, atom, bevel rim and
    gradient as logo.svg, but heavier strokes, larger nuclei and no blur
    filters so it still reads at 16x16 in a browser tab.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="34%" stop-color="#3b82f6"/>
      <stop offset="68%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e135f0"/>
    </linearGradient>
    <linearGradient id="spec" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#4deaff"/>
      <stop offset="55%" stop-color="#6d8cf8"/>
      <stop offset="100%" stop-color="#bb4bf7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.08" y1="0" x2="0.62" y2="1">
      <stop offset="0%" stop-color="#96cdff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#96cdff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.28" r="0.95">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <clipPath id="clip">
      <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z"/>
    </clipPath>
  </defs>

  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="url(#plate)"/>
  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="url(#sheen)"/>

  <g clip-path="url(#clip)">
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4"/>
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4" transform="rotate(120 32 32)"/>
    <circle cx="22.5" cy="15.5" r="4.2" fill="#ffffff"/>
    <circle cx="51" cy="32" r="4.2" fill="#ffffff"/>
    <circle cx="41.5" cy="48.5" r="4.2" fill="#ffffff"/>
    <circle cx="32" cy="32" r="5" fill="#7fe4ff" opacity="0.55"/>
    <circle cx="32" cy="32" r="4.6" fill="#ffffff"/>
  </g>

  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="none" stroke="#05070f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="none" stroke="url(#spec)" stroke-width="1.2" stroke-linejoin="round" opacity="0.85"/>
</svg>
