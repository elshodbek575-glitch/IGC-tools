<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Tab-size cut of the IGCtools mark: same hexagon, atom and gradient as
    logo.svg, but with heavier strokes, larger nuclei and no blur filters so it
    still reads at 16x16 in a browser tab.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="34%" stop-color="#3b82f6"/>
      <stop offset="68%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e135f0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4deaff"/>
      <stop offset="55%" stop-color="#6d8cf8"/>
      <stop offset="100%" stop-color="#bb4bf7"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <clipPath id="clip">
      <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z"/>
    </clipPath>
  </defs>

  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="url(#plate)"/>

  <g clip-path="url(#clip)">
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4"/>
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="19" ry="7.8" fill="none" stroke="url(#orbit)" stroke-width="4" transform="rotate(120 32 32)"/>
    <circle cx="22.5" cy="15.5" r="4.2" fill="#ffffff"/>
    <circle cx="51" cy="32" r="4.2" fill="#ffffff"/>
    <circle cx="41.5" cy="48.5" r="4.2" fill="#ffffff"/>
    <circle cx="32" cy="32" r="4.6" fill="#ffffff"/>
  </g>

  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linejoin="round"/>
</svg>
