  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="url(#sheen)"/>
  <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z" fill="none" stroke="#8fd8ff" stroke-opacity="0.14" stroke-width="1" transform="translate(32 32) scale(0.87) translate(-32 -32)"/>

