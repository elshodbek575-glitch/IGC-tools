    <circle cx="22.5" cy="15.5" r="3.6" fill="#38e8ff" opacity="0.9"/>
    <circle cx="22.5" cy="15.5" r="1.9" fill="#ffffff"/>
    <circle cx="51" cy="32" r="5.6" fill="#7c8cff" opacity="0.5" filter="url(#glow)"/>
