<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <!-- Full-detail IGCtools badge. Keep in sync with src/components/site/BrandMark.tsx -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
