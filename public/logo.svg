      <stop offset="68%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e135f0"/>
    </linearGradient>
    <linearGradient id="spec" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#5df0ff"/>
      <stop offset="52%" stop-color="#6d8cf8"/>
      <stop offset="100%" stop-color="#c04cf8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.08" y1="0" x2="0.62" y2="1">
